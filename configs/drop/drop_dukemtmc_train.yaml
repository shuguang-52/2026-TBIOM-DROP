data:
  root: 'reid-data'
  sources: ['dukemtmcreid']
  targets: ['dukemtmcreid']
  height: 384
  width: 128
  workers: 24
  transforms: ['rc', 're']

model:
  name: 'drop'
  save_model_flag: True
  bpbreid:
    pooling: 'gwamp'
    use_decouple: 'fpn'
    mask_filtering_training: False
    mask_filtering_testing: True
    learnable_attention_enabled: True
    backbone: 'hrnet32'
    hrnet_pretrained_path: 'pretrained_models'
    test_embeddings: ['bn_foreg', 'parts']
    masks:
      dir: 'pifpaf_maskrcnn_filtering'
      preprocess: 'five_v'

loss:
  name: 'part_based'
  part_based:
    name: 'part_averaged_triplet_loss'
    ppl: 'cl'
    with_ss: True
    bank_size: 256
    weights:
      globl:
        id: 1.
        tr: 0.
      foreg:
        id: 1.
        tr: 1.
      conct:
        id: 1.
        tr: 0.
      parts:
        id: 0.
        tr: 1.
      pixls:
        ce: 0.4

train:
  batch_size: 64
  eval_freq: 40

test:
  evaluate: False
  batch_size: 64
  visrank: False
