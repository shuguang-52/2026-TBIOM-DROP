<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">DROP implementation overview</title>
  <desc id="desc">A conceptual view of the released DROP model. An input image is processed by a shared HRNet backbone. Multi-scale features feed an appearance branch and a separate task-guided FPN parsing branch. Height-based position encoding is added to the parsing features before a part classification head predicts probability maps. These maps guide appearance-feature pooling and provide visibility scores. Pseudo parsing labels supervise the part head during training. The diagram simplifies the implementation and is not a reproduction of a paper figure.</desc>
  <defs>
    <marker id="arrow-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 Z" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 Z" fill="#3264bf"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 Z" fill="#128477"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9 Z" fill="#bc701c"/>
    </marker>
  </defs>

  <rect width="1120" height="520" rx="16" fill="#ffffff"/>
  <g font-family="Arial, sans-serif" fill="#1e293b">
    <text x="28" y="41" font-size="28" font-weight="700">DROP</text>
    <path d="M 122 20 V 44" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="140" y="40" font-size="21" font-weight="600">Implementation overview</text>
    <text x="28" y="70" font-size="15" fill="#64748b">Shared visual features, separate ReID and parsing paths, part-guided representations.</text>

    <!-- Shared input and multi-scale backbone. -->
    <rect x="28" y="172" width="92" height="146" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="44" y="185" width="60" height="92" rx="7" fill="#e8eef5"/>
    <circle cx="74" cy="204" r="9" fill="#94a3b8"/>
    <path d="M 61 220 Q 74 214 87 220 L 92 244 L 83 246 L 80 232 L 80 250 L 84 268 L 75 268 L 72 251 L 69 268 L 60 268 L 65 250 L 65 232 L 62 246 L 54 244 Z" fill="#94a3b8"/>
    <text x="74" y="299" font-size="15" text-anchor="middle" font-weight="600">Input image</text>
    <path d="M 120 245 H 164" fill="none" stroke="#64748b" stroke-width="2.2" marker-end="url(#arrow-neutral)"/>

    <rect x="164" y="164" width="168" height="172" rx="14" fill="#f8fafc" stroke="#b9c7d8" stroke-width="1.5"/>
    <text x="248" y="196" font-size="19" text-anchor="middle" font-weight="700">Shared HRNet</text>
    <text x="248" y="220" font-size="15" text-anchor="middle" fill="#526276">Multi-scale features</text>
    <g fill="#dce7f7" stroke="#7f9dc7" stroke-width="1.3">
      <rect x="184" y="242" width="38" height="66" rx="4"/>
      <rect x="229" y="254" width="29" height="54" rx="4"/>
      <rect x="265" y="266" width="22" height="42" rx="4"/>
      <rect x="294" y="278" width="16" height="30" rx="4"/>
    </g>
    <path d="M 332 245 H 354" fill="none" stroke="#64748b" stroke-width="2.2"/>
    <path d="M 354 245 V 190 H 380" fill="none" stroke="#3264bf" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
    <path d="M 354 245 V 338 H 380" fill="none" stroke="#128477" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
    <circle cx="354" cy="245" r="4" fill="#64748b"/>

    <!-- Appearance features and part pooling. -->
    <rect x="380" y="132" width="178" height="116" rx="12" fill="#eef4ff" stroke="#9bb9ec" stroke-width="1.5"/>
    <rect x="380" y="132" width="5" height="116" rx="2.5" fill="#3264bf"/>
    <text x="469" y="162" font-size="19" text-anchor="middle" font-weight="700" fill="#234f9e">ReID branch</text>
    <text x="469" y="190" font-size="16" text-anchor="middle">Appearance features</text>
    <text x="469" y="221" font-size="14" text-anchor="middle" fill="#526c96">resize + concatenate</text>
    <path d="M 558 190 H 772" fill="none" stroke="#3264bf" stroke-width="2.2" marker-end="url(#arrow-blue)"/>
    <text x="665" y="177" font-size="14" text-anchor="middle" fill="#526c96">appearance</text>

    <rect x="772" y="132" width="150" height="116" rx="12" fill="#eef4ff" stroke="#9bb9ec" stroke-width="1.5"/>
    <text x="847" y="163" font-size="19" text-anchor="middle" font-weight="700" fill="#234f9e">Part pooling</text>
    <g fill="#c7daf7">
      <rect x="806" y="178" width="17" height="25" rx="3"/>
      <rect x="829" y="178" width="17" height="25" rx="3"/>
      <rect x="852" y="178" width="17" height="25" rx="3"/>
      <rect x="875" y="178" width="13" height="25" rx="3"/>
    </g>
    <text x="847" y="227" font-size="14" text-anchor="middle" fill="#526c96">weighted features</text>
    <path d="M 922 190 H 962" fill="none" stroke="#3264bf" stroke-width="2.2" marker-end="url(#arrow-blue)"/>

    <!-- Parsing features are fused with height-based position information. -->
    <rect x="380" y="292" width="160" height="92" rx="12" fill="#ecf9f6" stroke="#8dcbbd" stroke-width="1.5"/>
    <rect x="380" y="292" width="5" height="92" rx="2.5" fill="#128477"/>
    <text x="460" y="326" font-size="18" text-anchor="middle" font-weight="700" fill="#106a61">Parsing branch</text>
    <text x="460" y="354" font-size="15" text-anchor="middle" fill="#396f68">Task-guided FPN</text>
    <path d="M 540 338 H 562" fill="none" stroke="#128477" stroke-width="2.2" marker-end="url(#arrow-teal)"/>
    <circle cx="576" cy="338" r="13" fill="#ffffff" stroke="#128477" stroke-width="1.8"/>
    <path d="M 570 338 H 582 M 576 332 V 344" fill="none" stroke="#128477" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M 589 338 H 612" fill="none" stroke="#128477" stroke-width="2.2" marker-end="url(#arrow-teal)"/>

    <rect x="612" y="292" width="126" height="92" rx="12" fill="#ecf9f6" stroke="#8dcbbd" stroke-width="1.5"/>
    <text x="675" y="326" font-size="18" text-anchor="middle" font-weight="700" fill="#106a61">Part head</text>
    <text x="675" y="354" font-size="15" text-anchor="middle" fill="#396f68">+ softmax</text>
    <path d="M 738 338 H 772" fill="none" stroke="#128477" stroke-width="2.2" marker-end="url(#arrow-teal)"/>

    <rect x="772" y="292" width="150" height="92" rx="12" fill="#ecf9f6" stroke="#8dcbbd" stroke-width="1.5"/>
    <text x="847" y="319" font-size="17" text-anchor="middle" font-weight="700" fill="#106a61">Part probability</text>
    <text x="847" y="340" font-size="17" text-anchor="middle" font-weight="700" fill="#106a61">maps</text>
    <text x="847" y="366" font-size="14" text-anchor="middle" fill="#396f68">parts + background</text>
    <path d="M 847 292 V 248" fill="none" stroke="#128477" stroke-width="2.2" marker-end="url(#arrow-teal)"/>
    <text x="859" y="274" font-size="14" fill="#396f68">masks</text>
    <path d="M 922 338 H 962" fill="none" stroke="#128477" stroke-width="2.2" marker-end="url(#arrow-teal)"/>

    <rect x="496" y="414" width="160" height="54" rx="10" fill="#f4fbf9" stroke="#a8d8cd" stroke-width="1.4"/>
    <text x="576" y="436" font-size="15" text-anchor="middle" font-weight="600" fill="#106a61">Position encoding</text>
    <text x="576" y="456" font-size="14" text-anchor="middle" fill="#396f68">height coordinates</text>
    <path d="M 576 414 V 351" fill="none" stroke="#128477" stroke-width="2" marker-end="url(#arrow-teal)"/>

    <!-- Pseudo labels supervise the parsing logits during training. -->
    <rect x="712" y="414" width="210" height="54" rx="10" fill="#fff8ed" stroke="#d7a560" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="817" y="436" font-size="16" text-anchor="middle" font-weight="600" fill="#9b5b13">Pseudo parsing labels</text>
    <text x="817" y="456" font-size="14" text-anchor="middle" fill="#9b5b13">training only</text>
    <path d="M 712 441 H 675 V 384" fill="none" stroke="#bc701c" stroke-width="2" stroke-dasharray="5 4" stroke-linejoin="round" marker-end="url(#arrow-orange)"/>

    <!-- Descriptors and visibility remain distinct outputs. -->
    <rect x="962" y="132" width="130" height="252" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="1027" y="156" font-size="15" text-anchor="middle" font-weight="700">ReID outputs</text>
    <g fill="#3264bf">
      <rect x="985" y="180" width="12" height="26" rx="3"/>
      <rect x="1003" y="174" width="12" height="32" rx="3" opacity="0.8"/>
      <rect x="1021" y="184" width="12" height="22" rx="3" opacity="0.65"/>
      <rect x="1039" y="177" width="12" height="29" rx="3" opacity="0.85"/>
      <rect x="1057" y="187" width="12" height="19" rx="3" opacity="0.5"/>
    </g>
    <text x="1027" y="228" font-size="15" text-anchor="middle" font-weight="600" fill="#234f9e">Part descriptors</text>
    <path d="M 980 255 H 1074" stroke="#dbe3ec" stroke-width="1.2"/>
    <g>
      <circle cx="994" cy="304" r="7" fill="#128477"/>
      <circle cx="1016" cy="304" r="7" fill="#128477"/>
      <circle cx="1038" cy="304" r="7" fill="#b7dbd3"/>
      <circle cx="1060" cy="304" r="7" fill="#128477"/>
    </g>
    <text x="1027" y="348" font-size="15" text-anchor="middle" font-weight="600" fill="#106a61">Visibility scores</text>

    <path d="M 28 496 H 57" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-neutral)"/>
    <text x="67" y="501" font-size="14" fill="#64748b">Feature / prediction flow</text>
    <path d="M 261 496 H 292" stroke="#bc701c" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-orange)"/>
    <text x="302" y="501" font-size="14" fill="#64748b">Training-only supervision</text>
    <text x="1092" y="501" font-size="14" text-anchor="end" fill="#64748b">Simplified view of the released HRNet + FPN model.</text>
  </g>
</svg>
